# AgentFlow Cron 调度配置
# 说明：将以下内容添加到系统 crontab（crontab -e）
# 或使用 Claude Code CronCreate（仅限当前会话）

# ──────────────────────────────────────────────
# 系统 crontab 配置（推荐，持久化）
# 执行：crontab -e  然后粘贴以下行：
# ──────────────────────────────────────────────

# 每个工作日早上 9:03 推送风险摘要（避免整点拥堵）
3 9 * * 1-5 /Users/a123/agent/agentflow/scripts/push-risk-summary.sh >> /tmp/agentflow/cron.log 2>&1

# 每个工作日下午 6:00 推送收工日报
0 18 * * 1-5 /Users/a123/agent/agentflow/scripts/push-risk-summary.sh >> /tmp/agentflow/cron-evening.log 2>&1

# 每小时检查 risk_register.json，若有高风险立即推送
17 * * * * /Users/a123/agent/agentflow/scripts/check-critical-risks.sh >> /tmp/agentflow/cron-alert.log 2>&1

# ──────────────────────────────────────────────
# Claude Code CronCreate 用法（会话内，重启后失效）
# 在 Claude Code 中输入以下内容触发：
# ──────────────────────────────────────────────
#
# 告诉 Claude：
# "每天早上 9:03 帮我执行 /Users/a123/agent/agentflow/scripts/push-risk-summary.sh"
#
# Claude 会自动调用 CronCreate，等效于：
# cron: "3 9 * * *"
# prompt: "请执行命令：bash /Users/a123/agent/agentflow/scripts/push-risk-summary.sh"
# recurring: true
#
# 注意：CronCreate 任务在 Claude 会话退出后失效
# 生产环境必须使用系统 crontab 或 launchd（macOS）

# ──────────────────────────────────────────────
# macOS launchd 配置（比 crontab 更稳定）
# 文件路径：~/Library/LaunchAgents/com.agentflow.daily.plist
# ──────────────────────────────────────────────
#
# 见同目录 launchd-daily.plist
